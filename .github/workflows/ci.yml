name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"

jobs:
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: banco_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d banco_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ${{ github.workspace }}/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven (local profile - unit tests only)
        run: mvn clean compile test -Plocal --batch-mode

      - name: Run integration tests (ci profile - Testcontainers)
        run: mvn verify -Pci --batch-mode
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Failsafe Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          retention-days: 7

      - name: Upload JaCoCo Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: target/site/jacoco/
          retention-days: 7

      - name: Upload Maven Site (Surefire HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-site
          path: target/site/
          retention-days: 7

      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find JaCoCo XML report
            const jacocoPath = 'target/site/jacoco/jacoco.xml';
            let coverageText = '## 📊 Code Coverage Report\n\n';

            if (fs.existsSync(jacocoPath)) {
              const xml = fs.readFileSync(jacocoPath, 'utf8');
              const instructionMatch = xml.match(/INSTRUCTION.*?covered="(\d+)" missed="(\d+)"/);
              const branchMatch = xml.match(/BRANCH.*?covered="(\d+)" missed="(\d+)"/);

              if (instructionMatch) {
                const covered = parseInt(instructionMatch[1]);
                const missed = parseInt(instructionMatch[2]);
                const total = covered + missed;
                const pct = ((covered / total) * 100).toFixed(1);
                coverageText += `**Instruction Coverage:** ${pct}% (${covered}/${total})\n`;
              }

              if (branchMatch) {
                const covered = parseInt(branchMatch[1]);
                const missed = parseInt(branchMatch[2]);
                const total = covered + missed;
                const pct = ((covered / total) * 100).toFixed(1);
                coverageText += `**Branch Coverage:** ${pct}% (${covered}/${total})\n`;
              }
            } else {
              coverageText += 'Coverage report not found. Run with `-Pci` profile.\n';
            }

            // Find test counts
            const surefireDir = 'target/surefire-reports';
            if (fs.existsSync(surefireDir)) {
              const files = fs.readdirSync(surefireDir).filter(f => f.endsWith('.txt'));
              let totalTests = 0, failures = 0, errors = 0, skipped = 0;
              for (const file of files) {
                const content = fs.readFileSync(path.join(surefireDir, file), 'utf8');
                const testMatch = content.match(/Tests run: (\d+), Failures: (\d+), Errors: (\d+), Skipped: (\d+)/);
                if (testMatch) {
                  totalTests += parseInt(testMatch[1]);
                  failures += parseInt(testMatch[2]);
                  errors += parseInt(testMatch[3]);
                  skipped += parseInt(testMatch[4]);
                }
              }
              coverageText += `\n**Unit Tests:** ${totalTests} (${failures} failures, ${errors} errors, ${skipped} skipped)\n`;
            }

            const failsafeDir = 'target/failsafe-reports';
            if (fs.existsSync(failsafeDir)) {
              const files = fs.readdirSync(failsafeDir).filter(f => f.endsWith('.txt'));
              let totalTests = 0, failures = 0, errors = 0, skipped = 0;
              for (const file of files) {
                const content = fs.readFileSync(path.join(failsafeDir, file), 'utf8');
                const testMatch = content.match(/Tests run: (\d+), Failures: (\d+), Errors: (\d+), Skipped: (\d+)/);
                if (testMatch) {
                  totalTests += parseInt(testMatch[1]);
                  failures += parseInt(testMatch[2]);
                  errors += parseInt(testMatch[3]);
                  skipped += parseInt(testMatch[4]);
                }
              }
              coverageText += `**Integration Tests:** ${totalTests} (${failures} failures, ${errors} errors, ${skipped} skipped)\n`;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverageText
            });

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check test results
        run: |
          if [ ! -f target/surefire-reports/*.txt ]; then
            echo "::error::No test reports found"
            exit 1
          fi
          # Check for failures
          if grep -r "Failures: [1-9]" target/surefire-reports/ 2>/dev/null || \
             grep -r "Errors: [1-9]" target/surefire-reports/ 2>/dev/null || \
             grep -r "Failures: [1-9]" target/failsafe-reports/ 2>/dev/null || \
             grep -r "Errors: [1-9]" target/failsafe-reports/ 2>/dev/null; then
            echo "::error::Test failures detected"
            exit 1
          fi
          echo "All tests passed"

      - name: Check JaCoCo coverage thresholds
        run: |
          if [ -f target/site/jacoco/jacoco.xml ]; then
            INSTRUCTION=$(grep -oP '(?<=INSTRUCTION.*covered=")\d+' target/site/jacoco/jacoco.xml | head -1)
            MISSED=$(grep -oP '(?<=INSTRUCTION.*missed=")\d+' target/site/jacoco/jacoco.xml | head -1)
            if [ -n "$INSTRUCTION" ] && [ -n "$MISSED" ]; then
              TOTAL=$((INSTRUCTION + MISSED))
              PCT=$((INSTRUCTION * 100 / TOTAL))
              if [ $PCT -lt 70 ]; then
                echo "::error::Instruction coverage ${PCT}% below 70% threshold"
                exit 1
              fi
            fi

            BRANCH_C=$(grep -oP '(?<=BRANCH.*covered=")\d+' target/site/jacoco/jacoco.xml | head -1)
            BRANCH_M=$(grep -oP '(?<=BRANCH.*missed=")\d+' target/site/jacoco/jacoco.xml | head -1)
            if [ -n "$BRANCH_C" ] && [ -n "$BRANCH_M" ]; then
              TOTAL=$((BRANCH_C + BRANCH_M))
              PCT=$((BRANCH_C * 100 / TOTAL))
              if [ $PCT -lt 60 ]; then
                echo "::error::Branch coverage ${PCT}% below 60% threshold"
                exit 1
              fi
            fi
            echo "Coverage thresholds met"
          else
            echo "::warning::JaCoCo report not found"
          fi